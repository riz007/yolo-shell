name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: fmt, clippy, test, bench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

      # The bench asserts against the latency budget, so a regression fails CI.
      - run: cargo bench

  hooks:
    name: shell hook syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: sudo apt-get update && sudo apt-get install -y zsh fish

      - run: zsh -n hooks/yolo.zsh
      - run: bash -n hooks/yolo.bash
      - run: fish --no-execute hooks/yolo.fish
      - run: sh -n install.sh
